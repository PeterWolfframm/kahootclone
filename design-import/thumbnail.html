<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden;font-family:var(--font-display)}
.wrap{display:flex;width:100%;height:100%}
.main{flex:1;background:var(--accent-primary);display:flex;align-items:center;justify-content:center}
.wordmark{color:var(--white);font-weight:700;font-size:150px;letter-spacing:-0.02em;line-height:1}
.strip{width:180px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="wrap">
<div class="main"><div class="wordmark">Keypad</div></div>
<div class="strip">
<div style="background:var(--beige-100)"></div>
<div style="background:var(--accent-400)"></div>
<div style="background:var(--accent-600)"></div>
<div style="background:var(--black)"></div>
</div>
</div>
</body></html>
