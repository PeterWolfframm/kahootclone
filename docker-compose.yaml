services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - rsshub-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  reader:
    build:
      context: ./reader
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      - rsshub
    environment:
      - SERVICE_FQDN_READER_80
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  rsshub-redis:
